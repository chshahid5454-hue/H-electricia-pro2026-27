<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07152B" />
      <stop offset="50%" stop-color="#0A1E3C" />
      <stop offset="100%" stop-color="#050F1F" />
    </linearGradient>

    <!-- Copper Metallic Gradient -->
    <linearGradient id="copperPipe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B4513" />
      <stop offset="25%" stop-color="#D97438" />
      <stop offset="50%" stop-color="#FCE1B6" />
      <stop offset="75%" stop-color="#E8A85C" />
      <stop offset="100%" stop-color="#6F370F" />
    </linearGradient>

    <!-- Copper Horizontal Pipe Gradient -->
    <linearGradient id="copperPipeH" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B4513" />
      <stop offset="25%" stop-color="#D97438" />
      <stop offset="50%" stop-color="#FCE1B6" />
      <stop offset="75%" stop-color="#E8A85C" />
      <stop offset="100%" stop-color="#6F370F" />
    </linearGradient>

    <!-- Glowing LED Glow -->
    <radialGradient id="ledGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="20%" stop-color="#FFF2A3" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#FFB300" stop-opacity="0.75" />
      <stop offset="75%" stop-color="#E8A85C" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0A1E3C" stop-opacity="0" />
    </radialGradient>

    <!-- Circuit Pattern Elements -->
    <filter id="bulbBloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" />

  <!-- Outer Border Ring (Copper / Electric Blue) -->
  <rect x="12" y="12" width="488" height="488" rx="96" fill="none" stroke="#E8A85C" stroke-width="4" stroke-opacity="0.4" />
  <rect x="20" y="20" width="472" height="472" rx="88" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="12 8" />

  <!-- PCB Circuit Texture Lines -->
  <g stroke="#1E3A8A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.45">
    <path d="M 40 80 L 110 80 L 140 110 L 140 180" />
    <path d="M 80 40 L 80 120 L 110 150" />
    <path d="M 472 80 L 402 80 L 372 110 L 372 180" />
    <path d="M 432 40 L 432 120 L 402 150" />
    <path d="M 40 432 L 120 432 L 150 402 L 150 340" />
    <path d="M 80 472 L 80 400 L 110 370" />
    <path d="M 472 432 L 392 432 L 362 402 L 362 340" />
    <path d="M 432 472 L 432 400 L 402 370" />
    <path d="M 210 50 L 256 90 L 302 50" />
    <path d="M 210 462 L 256 422 L 302 462" />
  </g>

  <!-- Circuit Solder Pads / Nodes -->
  <g fill="#E8A85C" opacity="0.6">
    <circle cx="140" cy="180" r="4.5" />
    <circle cx="110" cy="150" r="4" />
    <circle cx="372" cy="180" r="4.5" />
    <circle cx="402" cy="150" r="4" />
    <circle cx="150" cy="340" r="4.5" />
    <circle cx="110" cy="370" r="4" />
    <circle cx="362" cy="340" r="4.5" />
    <circle cx="402" cy="370" r="4" />
    <circle cx="256" cy="90" r="5" />
    <circle cx="256" cy="422" r="5" />
  </g>

  <!-- Large Letter H Made of Copper Pipe with Pipe Fittings -->
  <g filter="url(#softShadow)">
    <!-- Left Vertical Pipe -->
    <!-- Top Pipe Fitting Cap -->
    <rect x="112" y="80" width="56" height="18" rx="5" fill="url(#copperPipe)" stroke="#4A2508" stroke-width="2" />
    <rect x="120" y="92" width="40" height="328" rx="8" fill="url(#copperPipe)" stroke="#4A2508" stroke-width="2" />
    <!-- Bottom Pipe Fitting Cap -->
    <rect x="112" y="414" width="56" height="18" rx="5" fill="url(#copperPipe)" stroke="#4A2508" stroke-width="2" />

    <!-- Right Vertical Pipe -->
    <!-- Top Pipe Fitting Cap -->
    <rect x="344" y="80" width="56" height="18" rx="5" fill="url(#copperPipe)" stroke="#4A2508" stroke-width="2" />
    <rect x="352" y="92" width="40" height="328" rx="8" fill="url(#copperPipe)" stroke="#4A2508" stroke-width="2" />
    <!-- Bottom Pipe Fitting Cap -->
    <rect x="344" y="414" width="56" height="18" rx="5" fill="url(#copperPipe)" stroke="#4A2508" stroke-width="2" />

    <!-- Center Crossbar Copper Pipe -->
    <!-- Left Joint Collar -->
    <rect x="154" y="234" width="16" height="44" rx="4" fill="url(#copperPipeH)" stroke="#4A2508" stroke-width="1.5" />
    <!-- Center Pipe Body -->
    <rect x="164" y="238" width="184" height="36" rx="6" fill="url(#copperPipeH)" stroke="#4A2508" stroke-width="2" />
    <!-- Right Joint Collar -->
    <rect x="342" y="234" width="16" height="44" rx="4" fill="url(#copperPipeH)" stroke="#4A2508" stroke-width="1.5" />
  </g>

  <!-- Center Crossbar Junction Box / Bulb Socket Fitting -->
  <g filter="url(#softShadow)">
    <circle cx="256" cy="256" r="38" fill="#1E293B" stroke="#E8A85C" stroke-width="3.5" />
    <!-- Copper Socket Threads -->
    <path d="M 238 244 L 274 244 M 236 250 L 276 250 M 238 256 L 274 256" stroke="#D97438" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Glowing LED Bulb Radial Bloom Layer -->
  <circle cx="256" cy="256" r="110" fill="url(#ledGlow)" opacity="0.85" pointer-events="none" />

  <!-- LED Bulb Body in Center Crossbar with Filter Glow -->
  <g filter="url(#bulbBloom)">
    <!-- Bulb Glass Outline -->
    <path d="M 256 222 C 242 222 232 234 232 248 C 232 258 238 266 244 274 L 246 280 L 266 280 L 268 274 C 274 266 280 258 280 248 C 280 234 270 222 256 222 Z"
      fill="#FFFBEB" stroke="#FFA500" stroke-width="2.5" />

    <!-- Bright Glowing Filament / LED Core -->
    <circle cx="256" cy="246" r="8" fill="#FFFFFF" />
    <path d="M 252 252 L 254 242 L 258 242 L 260 252" stroke="#FF8C00" stroke-width="2" fill="none" />

    <!-- Electric Spark Rays -->
    <line x1="256" y1="208" x2="256" y2="198" stroke="#FFE082" stroke-width="3" stroke-linecap="round" />
    <line x1="220" y1="220" x2="212" y2="212" stroke="#FFE082" stroke-width="3" stroke-linecap="round" />
    <line x1="292" y1="220" x2="300" y2="212" stroke="#FFE082" stroke-width="3" stroke-linecap="round" />
    <line x1="208" y1="256" x2="198" y2="256" stroke="#FFE082" stroke-width="3" stroke-linecap="round" />
    <line x1="304" y1="256" x2="314" y2="256" stroke="#FFE082" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Subtitle Badge at the Bottom -->
  <g filter="url(#softShadow)">
    <rect x="136" y="448" width="240" height="34" rx="17" fill="#071426" stroke="#E8A85C" stroke-width="2" />
    <text x="256" y="470" fill="#E8A85C" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" letter-spacing="2.5" text-anchor="middle">
      SHAHID ELECTRICIAN
    </text>
  </g>
</svg>
